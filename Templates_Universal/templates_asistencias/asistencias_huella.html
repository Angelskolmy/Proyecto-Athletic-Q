{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Validar Huella</title>
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background:#1b1b1b; color:#f1f3f7; min-height:100vh; display:flex; flex-direction:column; }
    .navbar { background:linear-gradient(90deg,#c62828,#8e0000); }
    .wrapper-center { flex:1; display:flex; align-items:center; justify-content:center; }
    .card-val {
      width:700px; max-width:90vw; padding:32px; border:none; border-radius:18px;
      background:linear-gradient(160deg,#202020,#171717); box-shadow:0 25px 70px rgba(0,0,0,.45);
      text-align:center;
    }
    .icono {
      width:140px; height:140px; margin:0 auto 14px; display:grid; place-items:center;
      border-radius:28px; background:rgba(198,40,40,0.15); color:#c62828; transition:.25s;
    }
    .icono.activo { background:rgba(46,204,113,0.18); color:#2ecc71; }
    .estado { font-size:.95rem; color:#bfc4d6; min-height:22px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/home/">
      <img src="{% static 'img/logo.png' %}" alt="Logo" style="height:36px;" class="me-2">
      <span>Gimnasio | Validación</span>
    </a>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalQr">
      Validar asistencia (Escanear QR)
    </button>
  </div>
</nav>

<div class="wrapper-center">
  <div class="card-val">
    <div id="icono" class="icono"><i class="bi bi-fingerprint" style="font-size:62px;"></i></div>
    <h4 class="mb-1">Validador Biométrico</h4>
    <div id="estado" class="estado">Esperando huella...</div>
    <div id="resultado" class="fw-bold text-danger mt-3"></div>
  </div>
</div>

<!-- Modal reutilizable -->
  <div class="modal fade" id="modalMsg" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:radial-gradient(circle at 20% 20%, #0f1f3a, #0c1528); color:#f1f3f7; border:1px solid rgba(63,131,248,0.5); box-shadow:0 20px 60px rgba(0,0,0,0.4);">
        <div class="modal-body text-center p-4">
          <div id="modal-icon" class="mb-3 text-success" style="font-size:56px;">
            <i class="bi bi-check-circle-fill"></i>
          </div>
          <h4 class="mb-1" id="modal-title"></h4>
          <p class="mb-2" id="modal-sub"></p>
          <div id="modal-extra" class="mt-3 text-start" style="font-size:0.95rem; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:12px;">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <span class="text-muted">Estado</span>
              <span id="modal-estado" class="badge rounded-pill bg-success-subtle text-success fw-semibold">-</span>
            </div>
            <div class="small"><strong>Entrada:</strong> <span id="modal-entrada">-</span></div>
            <div class="small"><strong>Salida:</strong> <span id="modal-salida">-</span></div>
          </div>
          <button class="btn btn-primary w-100 mt-3" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

<!-- Modal QR -->
<div class="modal fade" id="modalQr" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="background:#1f1f1f; color:#f1f3f7; border:1px solid #3f83f8;">
      <div class="modal-header border-0">
        <h5 class="modal-title">Escanear código QR</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="qr-reader" style="width: 100%; min-height: 320px;"></div>
        <div id="qr-status" class="mt-3 text-info"></div>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script>
    const CAPTURE_URL = "http://localhost:5000/capture";
    const VALIDAR_URL = "/Empleados/validar-huella/";
    const icono = document.getElementById("icono");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");
    const modalEl = document.getElementById("modalMsg");
    const modal = new bootstrap.Modal(modalEl, { backdrop: "static", keyboard: false });
    const modalQrEl = document.getElementById("modalQr");
    const qrStatus = document.getElementById("qr-status");
    let qrScanner = null;
    let qrBusy = false;
    let clearTimer = null;
    let running = true;

    function setEstado(msg, ok = false) {
      estado.innerText = msg;
      if (ok) icono.classList.add("activo");
      else icono.classList.remove("activo");
    }

    function estadoClass(estadoTxt) {
      const t = (estadoTxt || "").toLowerCase();
      if (t.includes("salida")) return "bg-info-subtle text-info";
      if (t.includes("pend")) return "bg-warning-subtle text-warning";
      return "bg-success-subtle text-success";
    }

    function actionClass(titulo) {
      const t = (titulo || "").toLowerCase();
      if (t.includes("salida")) return "text-info";
      if (t.includes("pend")) return "text-warning";
      return "text-success";
    }

    function showModal(titulo, sub, ok = true, estadoTxt = "-", entrada = "-", salida = "-") {
      if (clearTimer) clearTimeout(clearTimer);
      document.getElementById("modal-title").innerText = titulo;
      document.getElementById("modal-title").className = actionClass(titulo);
      document.getElementById("modal-sub").innerText = sub;
      document.getElementById("modal-estado").innerText = estadoTxt || "-";
      document.getElementById("modal-estado").className = "badge rounded-pill fw-semibold " + estadoClass(estadoTxt);
      document.getElementById("modal-entrada").innerText = entrada || "-";
      document.getElementById("modal-salida").innerText = salida || "-";
      const icon = document.getElementById("modal-icon");
      if (ok) {
        icon.className = "mb-3 text-success";
        icon.innerHTML = '<i class="bi bi-check-circle-fill"></i>';
        modalEl.querySelector(".modal-content").style.borderColor = "rgba(46,204,113,0.6)";
      } else {
        icon.className = "mb-3 text-danger";
        icon.innerHTML = '<i class="bi bi-x-circle-fill"></i>';
        modalEl.querySelector(".modal-content").style.borderColor = "#c62828";
      }
      modal.show();
      clearTimer = setTimeout(() => modal.hide(), 8000);
    }

    function showFail(msg) {
      const texto = msg || "Huella no reconocida.";
      resultado.innerText = texto;
      setEstado("Esperando huella...", false);
      if (clearTimer) clearTimeout(clearTimer);
      clearTimer = setTimeout(() => { resultado.innerText = ""; }, 7000);
    }

    async function ciclo() {
      if (!running) return;
      try {
        setEstado("Capturando... coloca el dedo.");

        const resp = await fetch(CAPTURE_URL, { method: "POST" });
        const txt = await resp.text();
        let data;
        try { data = JSON.parse(txt); }
        catch { throw new Error("Respuesta no es JSON: " + txt); }
        if (!resp.ok || !data.ok || !data.xml) throw new Error(data.error || "Captura falló");

        const respVal = await fetch(VALIDAR_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
          body: JSON.stringify({ candidate: data.xml }),
        });
        const txtVal = await respVal.text();
        let valData;
        try { valData = JSON.parse(txtVal); }
        catch { throw new Error("Respuesta no es JSON al validar: " + txtVal); }

        // Si el backend responde sin ok (por horario u otra razón), muestra el mensaje y reintenta
        if (!respVal.ok || valData.ok === false) {
          throw new Error(valData.mensaje || valData.error || "Sin coincidencia");
        }

        const nombre = valData.usuario || "Usuario";
        const msgAsis = valData.asistencia || "";
        const entrada = valData.entrada || "-";
        const salida = valData.salida || "-";
        const estadoTxt = msgAsis || "Registrado";
        const titulo = msgAsis || "Asistencia registrada";
        const sub = `Usuario: ${nombre}`;
        showModal(titulo, sub, true, estadoTxt, entrada, salida);
        setEstado("Huella validada.", true);
        resultado.innerText = "";
      } catch (err) {
        console.error("Error en ciclo:", err);
        showFail(err?.message || "Error o sin coincidencia.");
        setEstado("Huellero no conectado o fuera de horario.", false);
      } finally {
        setTimeout(ciclo, 1000);
      }
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return "";
    }

    function startQrScanner() {
      qrBusy = false;
      qrStatus.innerText = "Apunta la cámara al código.";
      if (!qrScanner) {
        qrScanner = new Html5Qrcode("qr-reader");
      }
      qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onQrScanned,
        () => {}
      ).catch(err => {
        qrStatus.innerText = "No se pudo iniciar la cámara: " + err;
      });
    }

    function stopQrScanner() {
      qrBusy = false;
      if (qrScanner) {
        qrScanner.stop().catch(() => {});
        qrScanner.clear().catch(() => {});
        qrScanner = null;
      }
    }

    function onQrScanned(decodedText) {
      if (qrBusy) return;
      qrBusy = true;
      qrStatus.innerText = "Procesando asistencia...";

      fetch("{% url 'registrar_asistencia_ajax' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({ dato_qr: decodedText })
      })
      .then(async r => {
        if (!r.ok) {
          const txt = await r.text();
          throw new Error(txt || ("HTTP " + r.status));
        }
        return r.json();
      })
      .then(data => {
        const mensaje = data.mensaje || data.asistencia || "Asistencia registrada";
        qrStatus.innerText = mensaje;
        setTimeout(() => {
          const instance = bootstrap.Modal.getInstance(modalQrEl);
          if (instance) instance.hide();
          stopQrScanner();
          qrBusy = false;
          if (!running) { running = true; ciclo(); }
        }, 5000);
      })
      .catch(err => {
        qrStatus.innerText = "Error: " + (err.message || err);
        qrBusy = false;
      });
    }

    modalQrEl.addEventListener("shown.bs.modal", () => {
      running = false;
      startQrScanner();
    });

    modalQrEl.addEventListener("hidden.bs.modal", () => {
      stopQrScanner();
      setEstado("Esperando huella...", false);
      running = true;
      ciclo();
      qrStatus.innerText = "";
    });

    window.onload = () => {
      setEstado("Esperando huella...", false);
      ciclo();
    };
  </script>
</body>
</html>
