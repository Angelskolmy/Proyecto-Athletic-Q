<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Huella</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .finger-box {
            max-width: 450px;
            margin: auto;
            margin-top: 80px;
            padding: 35px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .finger-icon {
            font-size: 100px;
            color: #0d6efd;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        #mensaje-box {
            margin-top: 25px;
            display: none;
        }

        .spinner {
            margin-top: 25px;
            display: block;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="finger-box">
        
        <!-- Icono animado -->
        <i class="bi bi-fingerprint finger-icon"></i>

        <h3 class="mt-3">Validando Huella...</h3>
        <p class="text-muted">Coloque su dedo en el lector</p>

        <!-- Spinner siempre cargando -->
        <div class="spinner">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Esperando lectura...</p>
        </div>

        <!-- Caja donde se mostrará el mensaje de Django -->
        <div id="mensaje-box" class="alert alert-info"></div>

    </div>
</div>


<!-- JS Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/*
    Este JS recibe actualizaciones desde tu EXE o desde Django.
    Cuando recibas un JSON con el resultado, haces:

    actualizarMensaje("Bienvenido Juan Pérez", "success");
*/

function actualizarMensaje(texto, tipo="info") {

    const box = document.getElementById("mensaje-box");

    box.style.display = "block";
    box.className = "alert alert-" + tipo;
    box.innerText = texto;
}

</script>

</body>
</html>
