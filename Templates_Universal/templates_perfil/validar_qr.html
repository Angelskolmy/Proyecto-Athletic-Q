{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Validada</title>

    <link rel="stylesheet" href="{% static 'dist/css/adminlte.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap-icons-1.11.3/font/bootstrap-icons.min.css' %}">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 20px;
        }

        .big-icon {
            font-size: 5rem;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="card shadow border-0 p-4 text-center">

                    <i class="bi bi-check-circle-fill text-success big-icon mb-3"></i>
                    <h2 class="fw-bold text-success">¡Asistencia Validada!</h2>

                    <p class="mt-3">
                        La asistencia del usuario <strong>{{ usuario.first_name }} {{ usuario.last_name }}</strong> ha
                        sido registrada correctamente.
                    </p>

                    <hr>

                    <a href="{% url 'Perfil' %}" class="btn btn-danger mt-3">
                        <i class="bi bi-arrow-left-circle me-2"></i>Volver
                    </a>

                </div>

            </div>
        </div>
    </div>

</body>

</html>
